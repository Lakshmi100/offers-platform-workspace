# One label set for every repo in the project. Apply with scripts/sync-labels.sh.
# Keep the fixed shape (name, color, description) - the script reads it line by line.

# Story workflow
- name: story
  color: "1d76db"
  description: A user story with acceptance criteria
- name: needs-approval
  color: "fbca04"
  description: Draft story waiting for the approver's sign-off
- name: approved
  color: "0e8a16"
  description: Approver has signed off; ready to start

