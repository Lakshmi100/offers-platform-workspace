name: Story
description: A user story with acceptance criteria. Needs the approver's sign-off before work starts.
title: "[Story] "
labels: ["story", "needs-approval"]
assignees: ["Lakshmi100"]
body:
  - type: markdown
    attributes:
      value: |
        Stories open as **needs-approval**. The approver reviews and comments with changes; work starts only after the `approved` label is added.
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Who wants what, and why.
      value: |
        **As** …
        **I want** …
        **so that** …
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in (and anything explicitly out).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist the approver can verify.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      placeholder: "#12, #13"
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate (points)
      options: ["1", "2", "3", "5", "8", "13"]
  - type: checkboxes
    id: teardown
    attributes:
      label: Hourly-billed resources
      options:
        - label: This story creates hourly-billed resources (RDS, DMS, MWAA, EMR…), so the acceptance criteria include a teardown check and the session cost.
  - type: textarea
    id: notes
    attributes:
      label: Open questions / notes for the approver
